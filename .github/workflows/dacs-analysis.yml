name: DACS 3.0 Automated Analysis

on:
  # Schedule: Run automatically
  schedule:
    # Run every Monday, Wednesday, Friday at 9:00 AM UTC (11:00 AM Israel)
    - cron: '0 9 * * 1,3,5'

  # Manual trigger: Run on demand
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email with results'
        required: false
        type: boolean
        default: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper-ts/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install TypeScript dependencies
        working-directory: scraper-ts
        run: npm ci

      - name: Create .env file (root)
        run: |
          cat > .env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=gemini-flash-lite-latest
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD=${{ secrets.GMAIL_PASSWORD }}
          SEND_EMAIL=${{ secrets.SEND_EMAIL }}
          EOF

      - name: Create .env file (scraper-ts)
        working-directory: scraper-ts
        run: |
          cat > .env << EOF
          BARCHART_EMAIL=${{ secrets.BARCHART_EMAIL }}
          BARCHART_PASSWORD=${{ secrets.BARCHART_PASSWORD }}
          BARCHART_SCREENER_URL=${{ secrets.BARCHART_SCREENER_URL }}
          BARCHART_LOGIN_URL=https://www.barchart.com/login
          EOF

      - name: Install Playwright browsers
        working-directory: scraper-ts
        run: npx playwright install chromium

      - name: Run Barchart Screener
        id: screener
        working-directory: scraper-ts
        run: |
          echo "Running Barchart Screener..."
          npm run screener 2>&1 | tee screener.log

          echo "=== Screener Log (last 50 lines) ==="
          tail -50 screener.log

          # Check if "No symbols found" message exists
          if grep -q "No symbols found that match the requirements" screener.log; then
            echo "symbols_count=0" >> $GITHUB_OUTPUT
            echo "⚠️ No symbols found (screener returned no results)"
            exit 0  # This is not a failure - exit successfully
          fi

          # Extract symbols count from "Symbols found: N" line
          SYMBOLS=$(grep -oP 'Symbols found: \K\d+' screener.log || echo "0")
          echo "symbols_count=$SYMBOLS" >> $GITHUB_OUTPUT
          echo "✓ Found $SYMBOLS symbols"

          # Check if assets folder was created
          if [ -d "../assets" ]; then
            echo "Assets folders created:"
            ls -la ../assets/ | grep "^d" || echo "No asset folders"
          else
            echo "⚠️ Assets folder was not created!"
          fi

      - name: Run DACS Analysis
        id: analysis
        run: |
          echo "Running DACS 3.0 Analysis..."
          python csv_united.py --no-scrape 2>&1 | tee analysis.log

          # Count processed assets (check for success or no-symbols case)
          if grep -q "NO SYMBOLS FOUND FROM SCREENER" analysis.log; then
            ASSETS="0"
            echo "assets_processed=0" >> $GITHUB_OUTPUT
            echo "✓ No assets to process (no symbols found)"
          else
            ASSETS=$(grep -c '\[OK\].*completed' analysis.log || echo "0")
            echo "assets_processed=${ASSETS}" >> $GITHUB_OUTPUT
            echo "✓ Processed ${ASSETS} assets"
          fi

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dacs-reports-${{ github.run_number }}
          path: |
            assets/*/DACS*.html
            assets/*/merged_filtered_options.csv
            *.log
            scraper-ts/screenshots/*.png
          retention-days: 30

      - name: Send results summary
        if: always()
        run: |
          echo "## DACS 3.0 Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SYMBOLS_COUNT="${{ steps.screener.outputs.symbols_count }}"

          if [ "$SYMBOLS_COUNT" = "0" ]; then
            echo "### ⚠️ No Symbols Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The screener did not find any symbols matching the requirements." >> $GITHUB_STEP_SUMMARY
            echo "An email notification has been sent with the screener URL." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Results:" >> $GITHUB_STEP_SUMMARY
            echo "- Symbols found: $SYMBOLS_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- Assets processed: ${{ steps.analysis.outputs.assets_processed }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # List generated reports
          if [ -d "assets" ]; then
            REPORT_COUNT=$(find assets -name "DACS*.html" -type f | wc -l)
            if [ "$REPORT_COUNT" -gt "0" ]; then
              echo "### Generated Reports:" >> $GITHUB_STEP_SUMMARY
              find assets -name "DACS*.html" -type f | while read file; do
                echo "- \`$(basename $file)\`" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi

      - name: Check for errors
        if: always()
        run: |
          if grep -q "\[X\]" analysis.log 2>/dev/null; then
            echo "⚠️ Errors detected in analysis log"
            grep "\[X\]" analysis.log || true
            exit 0  # Don't fail the workflow
          else
            echo "✓ No errors detected"
          fi

      - name: Check email status
        if: always()
        run: |
          echo "## Email Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f "analysis.log" ]; then
            echo "⚠️ No analysis log found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Count email success/failure messages in logs (ensure clean integer output)
          EMAIL_SENT=$(grep -c '\[OK\] Email sent successfully' analysis.log 2>/dev/null || echo "0")
          EMAIL_FAILED=$(grep -c '\[!\] Email not sent' analysis.log 2>/dev/null || echo "0")
          EMAIL_DISABLED=$(grep -c 'Email sending disabled' analysis.log 2>/dev/null || echo "0")

          # Clean up any whitespace or newlines
          EMAIL_SENT=$(echo "$EMAIL_SENT" | tr -d '\n\r ')
          EMAIL_FAILED=$(echo "$EMAIL_FAILED" | tr -d '\n\r ')
          EMAIL_DISABLED=$(echo "$EMAIL_DISABLED" | tr -d '\n\r ')

          echo "- Emails sent: $EMAIL_SENT" >> $GITHUB_STEP_SUMMARY
          echo "- Emails failed: $EMAIL_FAILED" >> $GITHUB_STEP_SUMMARY

          # Use safer comparison that handles non-numeric values
          if [ ! -z "$EMAIL_SENT" ] && [ "$EMAIL_SENT" != "0" ]; then
            echo "✅ Emails were sent successfully"
          elif [ ! -z "$EMAIL_DISABLED" ] && [ "$EMAIL_DISABLED" != "0" ]; then
            echo "ℹ️ Email sending is disabled (SEND_EMAIL not set)"
          else
            echo "⚠️ No emails were sent - check GMAIL credentials in secrets"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ DACS Analysis failed!"
          echo "Check the logs for details."
